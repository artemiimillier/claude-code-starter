  <line x1="141" y1="56" x2="153" y2="68" stroke="#8ae3ee" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.5"/>
  <line x1="124" y1="39" x2="130" y2="45" stroke="#8ae3ee" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.3"/>
